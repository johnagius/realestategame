<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E3"/>
      <stop offset="100%" stop-color="#89B4C8"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D5A0"/>
      <stop offset="100%" stop-color="#A8BC82"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <!-- Grid pattern for ocean -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#9FC4D6" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Ocean background -->
  <rect width="1200" height="600" fill="url(#ocean)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Latitude lines -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#9FC4D6" stroke-width="0.5" opacity="0.3" stroke-dasharray="8,4"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#9FC4D6" stroke-width="0.8" opacity="0.4" stroke-dasharray="8,4"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#9FC4D6" stroke-width="0.5" opacity="0.3" stroke-dasharray="8,4"/>

  <g filter="url(#shadow)">
    <!-- North America -->
    <path d="M120,55 L155,50 L190,42 L230,48 L265,55 L295,70 L310,60 L320,72 L335,85 L342,100
             L338,120 L325,135 L318,155 L325,165 L332,180 L325,195 L310,205 L300,220
             L285,230 L275,245 L262,250 L250,248 L240,260 L225,268 L210,275 L195,270
             L180,262 L165,272 L148,265 L135,252 L122,240 L110,225 L98,210 L88,195
             L82,175 L78,158 L80,138 L85,118 L92,100 L100,82 L108,68 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>
    <!-- Greenland -->
    <path d="M310,25 L340,20 L365,28 L380,42 L375,60 L358,68 L338,65 L318,55 L308,40 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>
    <!-- Central America -->
    <path d="M195,270 L210,275 L218,282 L228,290 L235,298 L230,305 L218,300 L208,295
             L198,288 L192,280 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>

    <!-- South America -->
    <path d="M245,310 L265,298 L282,302 L298,310 L312,325 L322,345 L328,368 L330,392
             L325,418 L318,440 L305,458 L290,472 L275,480 L262,475 L252,460 L245,440
             L238,415 L232,390 L228,365 L230,340 L235,322 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>

    <!-- Europe -->
    <path d="M498,72 L515,68 L535,72 L555,65 L572,70 L585,78 L592,90 L600,82 L612,88
             L618,100 L612,112 L605,125 L598,135 L588,142 L575,148 L565,155 L555,150
             L542,155 L530,148 L520,142 L510,148 L498,145 L490,135 L485,120 L488,105
             L492,90 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>
    <!-- UK -->
    <path d="M478,78 L488,72 L495,80 L492,92 L485,98 L478,92 L475,85 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>
    <!-- Iceland -->
    <path d="M445,52 L458,48 L468,52 L465,60 L455,62 L445,58 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="0.8"/>
    <!-- Scandinavia -->
    <path d="M528,38 L542,32 L555,38 L562,52 L558,68 L548,62 L535,58 L525,52 L522,42 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>

    <!-- Africa -->
    <path d="M498,180 L520,172 L542,175 L562,180 L580,192 L595,208 L608,228 L618,252
             L622,278 L620,305 L615,332 L605,358 L592,382 L575,402 L555,415 L535,420
             L518,412 L502,398 L490,378 L482,355 L478,330 L475,305 L478,278 L482,252
             L488,228 L492,205 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>
    <!-- Madagascar -->
    <path d="M628,365 L635,358 L640,370 L638,385 L632,392 L625,382 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="0.8"/>

    <!-- Middle East / Arabia -->
    <path d="M618,175 L635,168 L652,172 L665,182 L672,195 L668,210 L658,222 L645,228
             L632,225 L622,218 L615,205 L612,190 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.2"/>

    <!-- Asia (Russia + Central) -->
    <path d="M612,88 L645,72 L682,58 L722,48 L762,42 L802,45 L842,52 L878,60 L908,55
             L938,62 L958,72 L968,85 L972,100 L965,115 L952,122 L935,118 L918,125
             L898,128 L878,122 L858,128 L838,125 L818,130 L798,128 L778,132 L758,128
             L738,132 L718,128 L698,135 L678,142 L658,148 L638,145 L620,138 L612,120 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>

    <!-- India -->
    <path d="M698,195 L718,188 L738,195 L748,212 L752,232 L745,255 L732,272 L718,280
             L705,275 L695,262 L688,242 L685,222 L690,205 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.2"/>

    <!-- China / East Asia -->
    <path d="M778,132 L808,128 L838,132 L862,142 L878,155 L888,172 L892,192 L885,210
             L872,222 L855,228 L838,225 L822,218 L808,208 L798,195 L788,178 L782,158
             L778,145 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.2"/>

    <!-- Southeast Asia -->
    <path d="M818,245 L838,238 L855,245 L868,258 L872,275 L865,290 L852,298 L835,295
             L822,285 L815,268 L812,255 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>

    <!-- Japan -->
    <path d="M920,108 L932,100 L940,108 L938,125 L932,138 L925,142 L918,135 L915,120 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1"/>

    <!-- Indonesia -->
    <path d="M828,310 L848,305 L868,310 L882,318 L878,328 L862,332 L842,328 L828,320 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="0.8"/>
    <path d="M888,318 L902,315 L912,322 L908,332 L895,330 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="0.8"/>

    <!-- Australia -->
    <path d="M892,368 L925,358 L958,362 L985,372 L1002,388 L1008,408 L1002,428
             L988,442 L968,448 L945,445 L922,438 L905,425 L895,408 L888,390 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="1.5"/>
    <!-- New Zealand -->
    <path d="M1028,428 L1035,420 L1042,428 L1040,442 L1032,448 L1025,440 Z"
          fill="url(#land)" stroke="#8BA06A" stroke-width="0.8"/>
  </g>

  <!-- Compass rose -->
  <g transform="translate(1120,520)" opacity="0.4">
    <circle r="18" fill="none" stroke="#6A8FA8" stroke-width="0.8"/>
    <text x="0" y="-22" text-anchor="middle" font-size="8" fill="#6A8FA8" font-weight="700">N</text>
    <text x="0" y="28" text-anchor="middle" font-size="7" fill="#6A8FA8">S</text>
    <text x="24" y="3" text-anchor="middle" font-size="7" fill="#6A8FA8">E</text>
    <text x="-24" y="3" text-anchor="middle" font-size="7" fill="#6A8FA8">W</text>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#6A8FA8" stroke-width="0.8"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#6A8FA8" stroke-width="0.8"/>
  </g>
</svg>
