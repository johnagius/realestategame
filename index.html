  <meta name="theme-color" content="#1F2733">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <div id="app">
    <header id="hud" class="hud hidden" role="banner" aria-label="Status"></header>

    <main id="screens" aria-live="off">
      <section id="screen-start" class="screen is-active" aria-label="Start"></section>
      <section id="screen-deals" class="screen" aria-label="Deals"></section>
      <section id="screen-city" class="screen" aria-label="City"></section>
      <section id="screen-portfolio" class="screen" aria-label="Portfolio"></section>
      <section id="screen-dynasty" class="screen" aria-label="Dynasty"></section>
      <section id="screen-rivals" class="screen" aria-label="Rivals"></section>
    </main>

    <nav id="nav" class="nav hidden" aria-label="Main"></nav>

    <div id="report" class="report" role="dialog" aria-modal="true" aria-label="Year report" aria-hidden="true"></div>
    <div id="titlecard" class="titlecard" role="dialog" aria-modal="true" aria-label="Chapter" aria-hidden="true"></div>
  </div>
