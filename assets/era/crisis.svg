<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- Era plate: Crisis, 1930s - boarded shopfronts, a leaning FOR SALE board, a cold chimney, a dead tree -->
  <rect width="320" height="180" fill="#F1EADA"/>
  <!-- sky: heavy horizontal hatching, dead calm -->
  <g stroke="#1D1A16" stroke-width="0.6" fill="none" opacity="0.5">
    <path d="M12 16 H308 M12 21 H308 M12 26 H308 M12 31 H308 M12 36 H308 M12 41 H308 M12 46 H308 M12 51 H308 M12 56 H308 M12 61 H308 M12 66 H308 M12 71 H308 M12 76 H308 M12 81 H308 M12 86 H308 M12 91 H308"/>
  </g>
  <g stroke="#1D1A16" stroke-width="0.5" fill="none" opacity="0.3">
    <path d="M12 13.5 H308 M12 18.5 H308 M12 23.5 H308 M12 28.5 H308"/>
  </g>
  <!-- bare dead tree -->
  <g stroke="#1D1A16" fill="none">
    <path d="M21 136 C22 120 20 106 23 92" stroke-width="2.4"/>
    <path d="M22 116 L13 105 M22 108 L31 97 M22.5 100 L17 88 M23 94 L29 84" stroke-width="1.2"/>
    <path d="M13 105 L10 99 M31 97 L35 91 M17 88 L14 82 M29 84 L33 79 M23 92 L24.5 84" stroke-width="0.6"/>
  </g>
  <!-- three boarded shopfronts -->
  <g fill="#1D1A16">
    <path d="M34 136 V96 H84 V136 Z M84 136 V92 H134 V136 Z M134 136 V98 H184 V136 Z"/>
  </g>
  <!-- upper windows: reserved paper under nailed planks -->
  <g fill="#F1EADA">
    <path d="M40 102 h7 v10 h-7 z M56 102 h7 v10 h-7 z M72 102 h7 v10 h-7 z"/>
    <path d="M106 98 h7 v10 h-7 z M122 98 h7 v10 h-7 z"/>
    <path d="M140 104 h7 v10 h-7 z M156 104 h7 v10 h-7 z M172 104 h7 v10 h-7 z"/>
  </g>
  <!-- the one dim lit window -->
  <path d="M90 98 h7 v10 h-7 z" fill="#D9B45C" opacity="0.55"/>
  <!-- plank hatching across the windows -->
  <g stroke="#1D1A16" stroke-width="2" fill="none" opacity="0.95">
    <path d="M40 105 l7 1.5 M40 109 l7 -1 M40 112 l7 1"/>
    <path d="M56 104 l7 2 M56 108 l7 -1 M56 111 l7 1.5"/>
    <path d="M72 105 l7 1 M72 109 l7 -1.5 M72 112 l7 1"/>
    <path d="M106 101 l7 1.5 M106 105 l7 -1 M106 108 l7 1"/>
    <path d="M122 100 l7 2 M122 104 l7 -1 M122 107 l7 1.5"/>
    <path d="M140 107 l7 1.5 M140 111 l7 -1 M156 107 l7 1 M156 111 l7 -1.5 M172 107 l7 1.5 M172 111 l7 -1"/>
  </g>
  <!-- cracked pane -->
  <path d="M159 109 l3 -3 M159 109 l4 1 M159 109 l-2 3.5 M159 109 l-1 -4" stroke="#1D1A16" stroke-width="0.5" fill="none" opacity="0.8"/>
  <!-- boarded storefronts, cross-nailed -->
  <g fill="#F1EADA">
    <path d="M38 116 h42 v16 h-42 z M88 114 h42 v18 h-42 z M138 118 h42 v14 h-42 z"/>
  </g>
  <g stroke="#1D1A16" stroke-width="2.4" fill="none" opacity="0.95">
    <path d="M39 117 L79 131 M79 117 L39 131"/>
    <path d="M89 115 L129 131 M129 115 L89 131"/>
  </g>
  <g stroke="#1D1A16" stroke-width="2" fill="none" opacity="0.9">
    <path d="M38 121 h42 M38 127 h42 M88 120 h42 M88 126 h42 M138 122 h42 M138 126 h42 M138 130 h42"/>
  </g>
  <!-- leaning FOR SALE board, lettering suggested by dashed rows -->
  <path d="M211 136 L207 103" stroke="#1D1A16" stroke-width="2" fill="none"/>
  <path d="M190 88 L234 84 L236 104 L192 108 Z" fill="#F4ECDA" stroke="#1D1A16" stroke-width="1.4"/>
  <g stroke="#1D1A16" stroke-width="1.3" fill="none" opacity="0.85">
    <path d="M196 93.6 l7 -0.7 M206 92.7 l6 -0.6 M215 92 l8 -0.8"/>
    <path d="M196 100.8 l9 -0.9 M208 99.7 l6 -0.6 M217 98.9 l9 -0.9"/>
  </g>
  <circle cx="212" cy="90.5" r="1" fill="#1D1A16"/>
  <!-- idle factory: cold chimney, no smoke -->
  <path d="M246 136 V112 H300 V136 Z" fill="#1D1A16"/>
  <path d="M262 112 L265 58 H271 L274 112 Z" fill="#1D1A16"/>
  <path d="M263.5 64 h9" stroke="#F1EADA" stroke-width="1" fill="none" opacity="0.8"/>
  <g fill="#F1EADA">
    <path d="M252 120 h4 v4 h-4 z M261 120 h4 v4 h-4 z M270 120 h4 v4 h-4 z M279 120 h4 v4 h-4 z M288 120 h4 v4 h-4 z"/>
  </g>
  <path d="M281 122 l2 -2 M281 122 l2.5 1 M281 122 l-1.5 2" stroke="#1D1A16" stroke-width="0.5" fill="none" opacity="0.8"/>
  <!-- street: heavy still hatching -->
  <path d="M12 136 H308" stroke="#1D1A16" stroke-width="1.6" fill="none"/>
  <g stroke="#1D1A16" stroke-width="0.6" fill="none" opacity="0.55">
    <path d="M16 141 H120 M140 141 H240 M258 141 H304"/>
    <path d="M24 146 H100 M118 146 H210 M228 146 H296"/>
    <path d="M16 151 H84 M104 151 H190 M210 151 H304"/>
    <path d="M28 156 H120 M140 156 H230 M250 156 H292"/>
    <path d="M20 161 H96 M116 161 H200 M222 161 H300"/>
  </g>
  <!-- double frame -->
  <rect x="4" y="4" width="312" height="172" fill="none" stroke="#1D1A16" stroke-width="2"/>
  <rect x="8" y="8" width="304" height="164" fill="none" stroke="#1D1A16" stroke-width="0.75"/>
</svg>
