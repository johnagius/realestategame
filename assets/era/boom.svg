    <path d="M264.5 46 L226 56 M264.5 46 L296 56" stroke-width="0.7"/>
    <path d="M240 56 V88" stroke-width="0.7"/>
  </g>
  <path d="M292 58 h5 v5 h-5 z" fill="#1D1A16"/>
  <path d="M234 88 h12 v5 h-12 z" fill="#1D1A16"/>
  <!-- unfinished house: open stud frame, paper showing through -->
  <g stroke="#1D1A16" fill="none">
    <path d="M230 136 V110 M237 136 V110 M244 136 V110 M251 136 V110 M256 136 V110" stroke-width="1.1"/>
    <path d="M230 110 H256 M230 123 H256" stroke-width="0.9"/>
    <path d="M230 110 L243 99 L256 110 M243 110 V99" stroke-width="1.1"/>
  </g>
  <!-- first pair of semis -->
  <path d="M34 136 V96 H108 V136 Z M30 96 L71 77 L112 96 Z" fill="#1D1A16"/>
  <path d="M94 91 V76 h6 v15 z" fill="#1D1A16"/>
  <path d="M71 96 V136" stroke="#F1EADA" stroke-width="1" fill="none" opacity="0.8"/>
  <g fill="#F1EADA">
    <path d="M42 102 h7 v8 h-7 z M58 102 h7 v8 h-7 z M78 102 h7 v8 h-7 z M94 102 h7 v8 h-7 z"/>
    <path d="M74 118 h8 v10 h-8 z M50 118 h7 v18 h-7 z M86 118 h7 v18 h-7 z"/>
  </g>
  <!-- the television glow -->
  <path d="M38 118 h8 v10 h-8 z" fill="#D9B45C"/>
  <path d="M40 120.5 h4 M40 123 h4" stroke="#1D1A16" stroke-width="0.5" fill="none" opacity="0.6"/>
  <!-- TV antennas -->
  <g stroke="#1D1A16" stroke-width="1" fill="none">
    <path d="M52 86 V68 M46 70 L58 76 M58 70 L46 76"/>
    <path d="M92 87 V70 M86 72 L98 78 M98 72 L86 78"/>
  </g>
  <!-- second pair of semis -->
  <path d="M128 136 V98 H196 V136 Z M124 98 L162 81 L200 98 Z" fill="#1D1A16"/>
  <path d="M136 91 V80 h6 v11 z" fill="#1D1A16"/>
  <path d="M162 98 V136" stroke="#F1EADA" stroke-width="1" fill="none" opacity="0.8"/>
  <g fill="#F1EADA">
    <path d="M136 104 h7 v8 h-7 z M152 104 h7 v8 h-7 z M168 104 h7 v8 h-7 z M184 104 h7 v8 h-7 z"/>
    <path d="M132 120 h8 v10 h-8 z M182 120 h8 v10 h-8 z M142 118 h7 v18 h-7 z M172 118 h7 v18 h-7 z"/>
  </g>
  <g stroke="#1D1A16" stroke-width="1" fill="none">
    <path d="M178 88 V72 M172 74 L184 80 M184 74 L172 80"/>
  </g>
  <!-- garage with up-and-over door -->
  <path d="M196 136 V112 H214 V136 Z" fill="#1D1A16"/>
  <path d="M199 118 h12 v16 h-12 z" fill="#F1EADA"/>
  <path d="M199 123 h12 M199 128 h12" stroke="#1D1A16" stroke-width="0.6" fill="none" opacity="0.8"/>
