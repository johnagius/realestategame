    <path d="M216.5 114 l1.8 -1.4 l1.9 1.4 l1.5 2.4 l-1.6 0.6 l-0.2 1.1 l0 3.4 l-3.2 0 l0 -3.4 l-1.6 -0.6 z"/>
    <path d="M223.5 114.5 h4 v6 h-4 z"/>
  </g>
  <!-- rounded family car at the kerb -->
  <path d="M58 136 v-9 q0 -5 7 -6 l5 -1 q3 -7 13 -7 q11 0 15 7 l5 1 q7 1 7 6 v9 z" fill="#1D1A16"/>
  <path d="M74 121 q2 -5.5 9 -5.5 q8 0 11 5.5 z" fill="#F1EADA"/>
  <path d="M83.5 115.5 V121" stroke="#1D1A16" stroke-width="0.7" fill="none"/>
  <circle cx="101" cy="127" r="1.3" fill="#F1EADA"/>
  <g fill="#F1EADA" stroke="#1D1A16" stroke-width="1.3">
    <circle cx="70" cy="132" r="4.5"/>
    <circle cx="94" cy="132" r="4.5"/>
  </g>
  <circle cx="70" cy="132" r="1.1" fill="#1D1A16"/>
  <circle cx="94" cy="132" r="1.1" fill="#1D1A16"/>
