  <path d="M12 136 H308" stroke="#1D1A16" stroke-width="1.6" fill="none"/>
  <g stroke="#1D1A16" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M20 143 h26 M62 145 h34 M118 143 h30 M164 145 h32 M214 143 h28 M258 145 h32"/>
    <path d="M36 152 h20 M92 154 h26 M146 152 h22 M198 154 h26 M248 152 h24"/>
    <path d="M56 161 h16 M128 162 h20 M188 161 h18 M238 162 h18"/>
  </g>
  <!-- double frame -->
  <rect x="4" y="4" width="312" height="172" fill="none" stroke="#1D1A16" stroke-width="2"/>
  <rect x="8" y="8" width="304" height="164" fill="none" stroke="#1D1A16" stroke-width="0.75"/>
</svg>
