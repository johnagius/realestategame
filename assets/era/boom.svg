<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- Era plate: Boom, 1950s - new semis with TV antennas, a crane raising the next estate, washing out, car at the kerb -->
  <rect width="320" height="180" fill="#F1EADA"/>
  <!-- sky: open and airy, light strokes and a bird -->
  <g stroke="#1D1A16" stroke-width="0.6" fill="none" opacity="0.45">
    <path d="M18 24 h22 M28 32 h16 M62 20 h18 M150 26 h24 M104 36 h14 M214 20 h18"/>
    <path d="M118 28 c2 -2 4 -2 6 0 c2 -2 4 -2 6 0" stroke-width="0.75"/>
  </g>
  <!-- sun: reserved paper with ray ticks -->
  <circle cx="272" cy="32" r="9" fill="#F8F3E8" stroke="#1D1A16" stroke-width="1"/>
  <g stroke="#1D1A16" stroke-width="0.75" fill="none" opacity="0.8">
    <path d="M272 19 v-4 M272 45 v4 M259 32 h-4 M285 32 h4 M263 23 l-3 -3 M281 23 l3 -3 M263 41 l-3 3 M281 41 l3 3"/>
  </g>
  <!-- crane raising the next estate -->
  <g stroke="#1D1A16" fill="none">
