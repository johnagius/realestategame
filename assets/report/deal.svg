        <path d="M180 96V82h8v14"/>
        <path d="M176 66h6v6h-6zM190 66h6v6h-6z"/>
        <path d="M156 96V58"/>
        <path d="M151 58h10l-2.5-10h-5z"/>
        <path d="M156 48v-3"/>
