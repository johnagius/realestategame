    <!-- the rising sun -->
    <path d="M84 96a26 26 0 0 1 52 0z" style="fill:var(--scene-accent, #D9B45C)"/>
    <g fill="none" style="stroke:var(--scene-accent, #D9B45C)" stroke-width="1.6" stroke-linecap="round">
      <path d="M110 62v-8M92 68l-6-6M128 68l6-6M84 78l-8-3M136 78l8-3"/>
    </g>
  </symbol>
  <use xlink:href="#scene" href="#scene" width="240" height="120" style="color:#1D1A16"/>
