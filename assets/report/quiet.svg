<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <symbol id="scene" viewBox="0 0 240 120">
    <!-- A quiet year: washing on the line, a cat on the wall, the lamp lit under a crescent moon. -->
