      <g stroke-width="0.75">
        <path d="M28 46c-3-3 3-5 0-8c-2-3 2-4 1-7"/>
        <path d="M72 42c-3-3 3-5 0-8"/>
        <path d="M24 76h4M24 88h4M50 76h4M68 76h4M50 88h4M68 88h4M80 76h4M96 76h4M80 88h4M96 88h4"/>
        <path d="M26 57l7-6M34 61l7-6M54 53l7-6M62 57l7-6M82 55l7-6M90 59l7-6"/>
      </g>
      <!-- the clothes-line, sagging to its pole -->
      <g stroke-width="1.2">
        <path d="M74 50Q112 62 150 50"/>
        <path d="M150 96V48"/>
        <circle cx="150" cy="47" r="1"/>
      </g>
      <!-- washing: a shirt and two cloths -->
      <g stroke-width="1.1">
        <path d="M90 55v13h10V55"/>
        <path d="M90 56l-4 4M100 56l4 4"/>
        <path d="M91.5 54v3M98.5 54v3"/>
        <path d="M110 58v13h12V58"/>
        <path d="M110 71q3 2 6 0q3-2 6 0"/>
        <path d="M112 56.5v3M120 56.5v3"/>
        <path d="M130 55v10h9v-9.5"/>
        <path d="M132 53.5v3M137 53.5v3"/>
      </g>
      <!-- garden wall, right -->
      <g stroke-width="1.6">
        <path d="M158 96V84h58v12"/>
        <path d="M156 84h62"/>
      </g>
      <g stroke-width="0.75">
        <path d="M164 90h8M178 90h8M192 90h8M206 90h6M170 93h8M184 93h8M198 93h8"/>
      </g>
