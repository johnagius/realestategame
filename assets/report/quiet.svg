    <!-- the cat, a small ink silhouette on the wall -->
    <path d="M181 84c0-7 2-11 5-12l-1-5l3 3l2-1.5l2 1.5l3-3l-1 5c3 1 5 5 5 12z" style="fill:currentColor"/>
    <path d="M199 84c4 0 6-3 5-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <!-- moon, stars, lamplight -->
    <path d="M52 24a11 11 0 1 0 9 17a9 9 0 0 1-9-17z" style="fill:var(--scene-accent, #D9B45C)"/>
    <g style="fill:var(--scene-accent, #D9B45C)">
      <circle cx="96" cy="20" r="0.9"/>
      <circle cx="124" cy="26" r="0.7"/>
      <circle cx="210" cy="52" r="2"/>
