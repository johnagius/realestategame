      <rect x="5" y="5" width="230" height="110" stroke-width="1.2"/>
      <rect x="8.5" y="8.5" width="223" height="103" stroke-width="0.5"/>
      <!-- sky hatch -->
      <g stroke-width="0.75">
        <path d="M150 17h30M158 21.5h22M154 26h24"/>
        <path d="M20 30h18M24 34h14"/>
      </g>
      <!-- terraces -->
      <g stroke-width="1.6">
        <path d="M20 96V64l14-12 14 12v32"/>
        <path d="M26 58V48h5v6"/>
        <path d="M30 96V82h8v14"/>
        <path d="M40 70h6v6h-6z"/>
        <path d="M48 96V60l14-12 14 12v36"/>
        <path d="M70 54V44h5v6"/>
        <path d="M58 96V82h8v14"/>
        <path d="M54 68h6v6h-6zM66 68h6v6h-6z"/>
        <path d="M76 96V62l14-12 14 12v34"/>
        <path d="M86 96V82h8v14"/>
        <path d="M84 70h6v6h-6zM94 70h6v6h-6z"/>
      </g>
