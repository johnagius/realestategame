<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City3D test — London</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d18; color: #eee; font-family: Nunito, sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: #141828; font-size: 12px; align-items: center; }
  #bar button { background: #26304a; color: #fff; border: 1px solid #3a4a70; border-radius: 6px; padding: 6px 9px; font-size: 12px; }
  #bar button.on { background: #d4a84b; color: #222; border-color: #f0d68a; }
  #city { flex: 1; position: relative; min-height: 0; }
  #stats { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; font-size: 11px; z-index: 5; pointer-events: none; }
  @media (max-width: 600px) { #city { flex: none; height: 460px; } }
  #sel { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.7); padding: 6px 10px; border-radius: 6px; font-size: 12px; z-index: 5; max-width: 60%; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span>Direction:</span>
    <button data-dir="" id="dir-city">City</button><button data-dir="a">A</button><button data-dir="b">B</button><button data-dir="c">C</button>
    <span id="dirname" style="color:#d4a84b;font-weight:700"></span>
    <span style="margin-left:8px">Era:</span>
    <button data-era="victorian">Victorian</button><button data-era="gilded">Gilded</button><button data-era="crisis">Crisis</button>
    <button data-era="boom">Boom</button><button data-era="modern" class="on">Modern</button><button data-era="digital">Digital</button>
    <span style="margin-left:8px">Quality:</span><button data-q="low">Low</button><button data-q="high" class="on">High</button>
    <span style="margin-left:8px">Night:</span><button data-n="0.1">Dusk</button><button data-n="0.55" class="on">Evening</button><button data-n="1">Night</button>
    <button id="orbit">Orbit</button><button id="focus">Focus sale</button><button id="reset">Reset view</button><button id="upd">Buy + renovate</button>
  </div>
  <div id="city"><div id="stats"></div><div id="sel">Tap a building</div></div>
</div>
<script src="/js/vendor/three.min.js"></script>
<script src="/js/vendor/shaders/CopyShader.js"></script>
<script src="/js/vendor/loaders/GLTFLoader.js"></script>
<script src="/js/vendor/shaders/LuminosityHighPassShader.js"></script>
<script src="/js/vendor/shaders/SSAOShader.js"></script>
<script src="/js/vendor/shaders/GradeShader.js"></script>
<script src="/js/vendor/math/SimplexNoise.js"></script>
<script src="/js/vendor/postprocessing/Pass.js"></script>
<script src="/js/vendor/postprocessing/EffectComposer.js"></script>
<script src="/js/vendor/postprocessing/RenderPass.js"></script>
<script src="/js/vendor/postprocessing/ShaderPass.js"></script>
<script src="/js/vendor/postprocessing/UnrealBloomPass.js"></script>
<script src="/js/vendor/postprocessing/SSAOPass.js"></script>
<script src="/js/city3d-engine.js"></script>
<script src="sketch-layer.js"></script>
<script src="/js/cities/london.js"></script>
<script src="/js/cities/paris.js"></script>
<script src="/js/cities/new_york.js"></script>
<script src="/js/cities/amsterdam.js"></script>
<script src="/js/cities/berlin.js"></script>
<script src="/js/cities/rome.js"></script>
<script src="/js/cities/barcelona.js"></script>
<script src="/js/cities/monaco.js"></script>
<script src="/js/cities/sydney.js"></script>
<script src="/js/cities/hong_kong.js"></script>
<script src="/js/cities/mumbai.js"></script>
<script src="/js/cities/toronto.js"></script>
<script src="/js/cities/shanghai.js"></script>
<script src="/js/cities/cape_town.js"></script>
<script src="/js/cities/tokyo.js"></script>
<script src="/js/cities/singapore.js"></script>
<script src="/js/cities/los_angeles.js"></script>
<script src="/js/cities/sao_paulo.js"></script>
<script src="/js/cities/miami.js"></script>
<script src="/js/cities/dubai.js"></script>
<script>
  // London slots in scan order: TH AP CM MN SK HO ST VI PH CM WR TH
  var PROPS = [
    { id: 'p1', type: 'townhouse', model3d: 'TH', name: 'Bedford Row', ownerId: 'player', condition: 72, era: 'victorian' },
    { id: 'p2', type: 'apartment', model3d: 'AP', name: 'Mayfair Mansions', ownerId: 'rival:ashworth', condition: 60 },
    { id: 'p3', type: 'commercial', model3d: 'CM', name: 'Strand Arcade', ownerId: null, isListing: true, condition: 55 },
    { id: 'p4', type: 'mansion', model3d: 'MN', name: 'Belgrave House', ownerId: 'player', condition: 92, era: 'gilded' },
    { id: 'p5', type: 'skyscraper', model3d: 'SK', name: 'Bishopsgate Tower', ownerId: 'rival:okafor', condition: 88 },
    { id: 'p6', type: 'house', model3d: 'HO', name: 'Lambeth Cottage', ownerId: null, isListing: true, condition: 12 },
    { id: 'p7', type: 'studio', model3d: 'ST', name: 'Borough Studios', ownerId: 'player', condition: 35, renovation: { tier: 'refurb', yearsLeft: 1 } },
    { id: 'p8', type: 'villa', model3d: 'VI', name: 'Richmond Villa', ownerId: null, condition: 70 },
    { id: 'p9', type: 'penthouse', model3d: 'PH', name: 'Southbank Penthouse', ownerId: 'player', condition: 50, renovation: { tier: 'rebuild', yearsLeft: 3 } },
    { id: 'p10', type: 'commercial', model3d: 'CM', name: 'Bermondsey Works', ownerId: 'rival:ashworth', condition: 15 },
    { id: 'p11', type: 'warehouse', model3d: 'WR', name: 'Docklands Depot', ownerId: null, isListing: true, condition: 42 },
    { id: 'p12', type: 'townhouse', model3d: 'TH', name: 'Kennington Terrace', ownerId: 'rival:okafor', condition: 80 },
  ];
  // ── Project Skyline direction variants (experiment presets) ──
  // No ?dir= → the city's own profile (CityDef_<City>.profile, shipped art
  // direction). ?dir=a|b|c overrides with an experiment preset, any city.
  // Note: tree/lamp kinds bake into terrain at render time — use the dir buttons
  // (full re-render); the era buttons only cross-fade colours.
  var qs = new URLSearchParams(location.search);
  var DIR = (qs.get('dir') || '').toLowerCase() || null; // null = city profile
  var DIRS = {
    a: { name: 'A · Ledger Craft', profile: {
      base: { exposure: 1.06, sunDay: 0xffd9a8, sunDusk: 0xd88a5a, sunIntensity: 1.0,
        ambDay: 0x4a4258, ambDusk: 0x241c2c, hemiSky: 0xffd2a0, hemiGround: 0x4a352c,
        water: { color: 0x14323e, specular: 0x2a4a56, opacity: 0.92 }, trees: 'plane' },
      victorian: { sky: ['#241a34', '#7a4632', '#cf8a4a'], fog: 0x7e4c2a, haze: 0.52, lamps: 'gas' },
      gilded:    { sky: ['#221a36', '#7c4a44', '#cf9462'], fog: 0x7e4e34, haze: 0.45, lamps: 'gas' },
      crisis:    { sky: ['#1c1a2a', '#54484a', '#9a7a5c'], fog: 0x4e4038, haze: 0.6,  lamps: 'gas' },
      boom:      { sky: ['#1e2036', '#5c5478', '#cf8a5a'], fog: 0x644e3c, haze: 0.38, lamps: 'modern' },
      modern:    { sky: ['#141c38', '#3e4670', '#c8825e'], fog: 0x54423a, haze: 0.3,  lamps: 'modern' },
      digital:   { sky: ['#0a0e22', '#2a3058', '#8a5a8a'], fog: 0x2e2a50, haze: 0.25, lamps: 'neon' },
    } },
    b: { name: 'B · Glass Commonwealth', profile: {
      base: { exposure: 1.1, sunDay: 0xffe2b8, sunDusk: 0x9ab2e0,
        ambDay: 0x323a4e, ambDusk: 0x1a2238, hemiSky: 0xbcd4ff, hemiGround: 0x3c4a3c,
        wallJitter: 0.07, water: { color: 0x1d5a8a, specular: 0x99ccee, opacity: 0.9 }, trees: 'plane', lamps: 'modern' },
      victorian: { sky: ['#1c1c44', '#6a4a6e', '#e89a5a'], fog: 0x4c3c5e, haze: 0.22 },
      gilded:    { sky: ['#201c4a', '#7a4a78', '#f0a868'], fog: 0x584064, haze: 0.2 },
      crisis:    { sky: ['#181c34', '#4a5480', '#c8a078'], fog: 0x3c4262, haze: 0.28 },
      boom:      { sky: ['#16204a', '#5a5a9a', '#f4a860'], fog: 0x444880, haze: 0.16 },
      modern:    { sky: ['#12224a', '#3f5590', '#e8a06a'], fog: 0x2c3c6e, haze: 0.18 },
      digital:   { sky: ['#081230', '#243a7e', '#8a5ec0'], fog: 0x1c2a5e, haze: 0.14 },
    } },
    c: { name: 'C · Living Weather', profile: {
      base: { exposure: 1.04, sunDay: 0xfff0dd, sunDusk: 0xe0784a,
        ambDay: 0x424a5e, ambDusk: 0x181e30, hemiSky: 0xe8e2d8, hemiGround: 0x3a3630,
        water: { color: 0x0e2436, specular: 0xbbddff, opacity: 0.94 }, trees: 'plane' },
      victorian: { sky: ['#2c2438', '#6a4a44', '#b98a62'], fog: 0xa08a6a, haze: 0.7,  lamps: 'gas',    road: 0x1a1817, side: 0x322e29 },
      gilded:    { sky: ['#2a2238', '#6e4a54', '#c08e62'], fog: 0xa48868, haze: 0.6,  lamps: 'gas',    road: 0x1f1c19, side: 0x3b362f },
      crisis:    { sky: ['#222230', '#4c4a56', '#968a76'], fog: 0x7e786c, haze: 0.78, lamps: 'gas',    road: 0x18181d, side: 0x2c2c31 },
      boom:      { sky: ['#222842', '#5a5c82', '#c89062'], fog: 0x847876, haze: 0.5,  lamps: 'modern', road: 0x1c1c20, side: 0x3c3a37 },
      modern:    { sky: ['#182038', '#3c4668', '#b8815e'], fog: 0x6e6a6c, haze: 0.45, lamps: 'modern', road: 0x14161e, side: 0x2d303b },
      digital:   { sky: ['#0c1226', '#263258', '#7a5890'], fog: 0x3a3a5c, haze: 0.35, lamps: 'neon',   road: 0x0d1016, side: 0x222633 },
    } },
  };
  // ── City selector (?city=<id>, default london) — map mirrors js/ui/city.js ──
  var CITYMAP = {
    london: 'CityDef_London', paris: 'CityDef_Paris', new_york: 'CityDef_NewYork',
    amsterdam: 'CityDef_Amsterdam', berlin: 'CityDef_Berlin', rome: 'CityDef_Rome',
    barcelona: 'CityDef_Barcelona', monaco: 'CityDef_Monaco', sydney: 'CityDef_Sydney',
    hong_kong: 'CityDef_HongKong', mumbai: 'CityDef_Mumbai', toronto: 'CityDef_Toronto',
    shanghai: 'CityDef_Shanghai', cape_town: 'CityDef_CapeTown', tokyo: 'CityDef_Tokyo',
    singapore: 'CityDef_Singapore', los_angeles: 'CityDef_LosAngeles',
    sao_paulo: 'CityDef_SaoPaulo', miami: 'CityDef_Miami', dubai: 'CityDef_Dubai',
  };
  var CITY = (qs.get('city') || 'london').toLowerCase();
  var CAM = qs.get('camera') === 'perspective' ? 'perspective' : 'ortho';
  var POST = qs.get('post') !== '0';
  var ASSETS = qs.get('assets') !== '0';
  if (!CITYMAP[CITY]) CITY = 'london';
  function cityDef() { return window[CITYMAP[CITY]]; }
  // Generic props per city: one per building slot, rotating owners/conditions so
  // windows, banners and listings show across the fleet. London keeps its authored set.
  var OWNERS = ['player', 'rival:ashworth', null, 'rival:okafor', 'player', null];
  var CONDS = [72, 60, 55, 92, 88, 12, 35, 70, 50, 15, 42, 80];
  var FILLERS = ['TH', 'AP', 'CM', 'MN', 'SK', 'HO', 'ST', 'VI', 'PH', 'CM', 'WR', 'TH'];
  function propsFor(def) {
    if (CITY === 'london') return PROPS;
    var out = [];
    def.layout.forEach(function(row) {
      row.forEach(function(t) {
        if (t === 'B' || City3D.BLDG_TYPES.has(t)) {
          var i = out.length, own = OWNERS[i % OWNERS.length];
          out.push({ id: 'p' + (i + 1), type: 'townhouse', model3d: t === 'B' ? FILLERS[i % FILLERS.length] : t,
            name: def.name + ' ' + (i + 1), ownerId: own, condition: CONDS[i % CONDS.length],
            isListing: own === null && i % 2 === 0, era: i % 5 === 0 ? 'victorian' : undefined });
        }
      });
    });
    return out;
  }
  if (DIR && !DIRS[DIR]) DIR = null; // unknown key falls back to the city profile
  // ?sketch=1 layers the target-look prototype (sketch-layer.js) over the chosen direction.
  var SKETCH = (new URLSearchParams(location.search)).get('sketch') === '1';
  function dirProfile() { return DIR ? DIRS[DIR].profile : null; }
  var QINIT = qs.get('q');
  var CAMDIR = qs.get('camdir'); // debug camera direction "x,y,z" (test tool only)
  var state = { era: 'modern', quality: QINIT === 'low' ? 'low' : 'high', night: 0.55 };
  function render() {
    var def = cityDef();
    document.title = 'City3D test — ' + def.name;
    City3D.renderCity(def, document.getElementById('city'), propsFor(def), {
      era: state.era, quality: state.quality, night: state.night, camera: CAM, post: POST, assets: ASSETS,
      profile: dirProfile(),
      playerColor: '#d4a84b', rivalColors: { ashworth: '#3d7bd8', okafor: '#c2455a' },
      onSelect: function(p) { document.getElementById('sel').textContent = p.name + ' · ' + (p.ownerId || 'unowned') + ' · cond ' + p.condition; },
    });
    City3D._onBuildingClick = function(cell) { if (!cell.property) document.getElementById('sel').textContent = City3D.BNAMES[cell.t] || cell.t; };
    document.getElementById('dirname').textContent = cityDef().name + ' · ' + (DIR ? DIRS[DIR].name : 'city profile');
    document.querySelectorAll('[data-dir]').forEach(function(x) { x.classList.toggle('on', (x.dataset.dir || null) === DIR); });
    if (CAMDIR) { var cd = CAMDIR.split(',').map(Number); if (cd.length === 3 && cd.every(function(n) { return isFinite(n); })) { City3D._camDir = new THREE.Vector3(cd[0], cd[1], cd[2]).normalize(); City3D._fitCamera(City3D._container.clientWidth / Math.max(1, City3D._container.clientHeight)); } }
    // ?districts=1 paints the district-overlay sample (LOCATION-SLICE §6); ratings
    // are the engine's London visitor bands, hardcoded here (test tool only).
    if (qs.get('districts') === '1') City3D.setDistrictOverlay(true, { Mayfair: 2, Kensington: 1, Chelsea: 1, 'Notting Hill': 1, Camden: 1, Shoreditch: 1, Hampstead: 0, 'Canary Wharf': 0 });
    if (SKETCH && window.SkylineSketch) setTimeout(function() { SkylineSketch.apply(); }, 60);
  }
  render();
  document.querySelectorAll('[data-dir]').forEach(function(b) { b.onclick = function() {
    DIR = b.dataset.dir || null;
    if (history.replaceState) history.replaceState(null, '', DIR ? '?dir=' + DIR : location.pathname);
    render();
  }; });
  document.querySelectorAll('[data-era]').forEach(function(b) { b.onclick = function() {
    document.querySelectorAll('[data-era]').forEach(function(x) { x.classList.remove('on'); }); b.classList.add('on');
    state.era = b.dataset.era; City3D.setEra(state.era, 1200);
  }; });
  document.querySelectorAll('[data-q]').forEach(function(b) { b.onclick = function() {
    document.querySelectorAll('[data-q]').forEach(function(x) { x.classList.remove('on'); }); b.classList.add('on');
    state.quality = b.dataset.q; render();
  }; });
  document.querySelectorAll('[data-n]').forEach(function(b) { b.onclick = function() {
    document.querySelectorAll('[data-n]').forEach(function(x) { x.classList.remove('on'); }); b.classList.add('on');
    state.night = +b.dataset.n; City3D.setNight(state.night);
  }; });
  var orbiting = false;
  document.getElementById('orbit').onclick = function() { orbiting = !orbiting; City3D.setAutoOrbit(orbiting); };
  document.getElementById('focus').onclick = function() { City3D.setSelected('p3'); City3D.focus('p3'); };
  document.getElementById('reset').onclick = function() { City3D.setSelected(null); City3D.resetView(); };
  document.getElementById('upd').onclick = function() {
    var p = Object.assign({}, PROPS[2], { ownerId: 'player', isListing: false, renovation: { tier: 'refurb', yearsLeft: 1 }, condition: 55 });
    City3D.updateProperty(p, { animate: true });
  };
  setInterval(function() { var s = City3D.getStats(); document.getElementById('stats').textContent = 'js ' + (s.frameMs || 0).toFixed(1) + ' ms · ' + s.calls + ' calls · ' + s.triangles + ' tris · ' + s.quality; }, 500);
</script>
</body>
</html>
